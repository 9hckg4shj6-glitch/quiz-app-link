name: Apple OAuth secret reminder

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EXPIRES_ON: ${{ vars.APPLE_OAUTH_SECRET_EXPIRES_ON }}
    steps:
      - name: Check Apple OAuth secret expiry
        shell: bash
        run: |
          if [[ -z "$EXPIRES_ON" ]]; then
            echo "APPLE_OAUTH_SECRET_EXPIRES_ON is not configured; skipping."
            exit 0
          fi
          if ! expiry_epoch=$(date -u -d "$EXPIRES_ON" +%s 2>/dev/null); then
            echo "APPLE_OAUTH_SECRET_EXPIRES_ON must be YYYY-MM-DD."
            exit 1
          fi
          today_epoch=$(date -u -d "$(date -u +%F)" +%s)
          days_left=$(( (expiry_epoch - today_epoch) / 86400 ))
          if (( days_left > 30 )); then
            echo "Apple OAuth secret expires in $days_left days; no reminder needed."
            exit 0
          fi
          title="Apple OAuth Secretを更新する（期限: $EXPIRES_ON）"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Apple OAuth Secretを更新する in:title" --json number --jq 'length')
          if (( existing > 0 )); then
            echo "An open renewal issue already exists."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Appleログイン用OAuth Secretの期限まで **${days_left}日** です。Apple Developerで新しいSecretを作成し、Supabase AuthのApple providerへ登録後、Actions Variable \`APPLE_OAUTH_SECRET_EXPIRES_ON\` を新しい期限へ更新してください。署名鍵（.p8）はGitHubへ保存しません。"
