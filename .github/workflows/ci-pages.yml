name: Test and deploy Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          # 公開ランキング/同期用。リポジトリ Settings → Secrets に登録すると本番ビルドへ注入される。
          # 未設定でもビルドは成功し、アプリはローカル専用（ランキングは「準備中」表示）で動作する。
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # DB・Google設定完了後、Actions Variableを true にして公開する。
          VITE_SOCIAL_AUTH_ENABLED: ${{ vars.VITE_SOCIAL_AUTH_ENABLED }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: built-site-${{ github.sha }}
          path: dist
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://9hckg4shj6-glitch.github.io/quiz-app-link/
    steps:
      # actions/deploy-pages は使わない。あれは完了までポーリングし、待ちきれないと
      # デプロイ自体をキャンセルする（src/internal/deployment.js の timeout ハンドラ）。
      # timeout 入力は10分（600000ms）でクランプされるので延ばせない。
      # このサイトは画像込みで約140MB あり Pages 側の処理が10分を超えるため、
      # 2026-08-06 に7回連続で「投げる→10分で自分でキャンセル」を繰り返して本番が止まった。
      # そこでデプロイ生成のAPIだけ叩いて待たずに抜ける。完了確認は下の curl で行う。
      - name: Create Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id_token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "github-pages")][0].id')
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" \
            -F artifact_id="$artifact_id" \
            -f pages_build_version="$GITHUB_SHA" \
            -f oidc_token="$id_token" \
            --jq '.page_url'

      # 状態を見るだけ。ここで打ち切ってもデプロイはサーバ側で走り続ける。
      - name: Wait for the deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for _ in $(seq 1 60); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$GITHUB_SHA" --jq '.status' 2>/dev/null || echo unknown)
            case "$status" in
              succeed) echo "デプロイ完了"; exit 0 ;;
              error|failed) echo "デプロイ失敗: $status"; exit 1 ;;
              *) echo "$status" ;;
            esac
            sleep 30
          done
          echo "30分たっても完了しなかった（最後の状態: $status）。デプロイ自体は進行中の可能性が高いので、押し直さず本番を確認すること。"
          exit 1
