name: Test and deploy Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          # 公開ランキング/同期用。リポジトリ Settings → Secrets に登録すると本番ビルドへ注入される。
          # 未設定でもビルドは成功し、アプリはローカル専用（ランキングは「準備中」表示）で動作する。
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # DB・Google設定完了後、Actions Variableを true にして公開する。
          VITE_SOCIAL_AUTH_ENABLED: ${{ vars.VITE_SOCIAL_AUTH_ENABLED }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: built-site-${{ github.sha }}
          path: dist
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages 側のキューが混むと deployment_queued のまま10分で打ち切られることがある。
      # 打ち切りはそのデプロイを「キャンセル済み」にするので、次のデプロイが
      # "due to in progress deployment" で弾かれ、本番が更新できなくなる循環に入る
      # （2026-08-06 に発生し、本番が第7回のまま数十分止まった）。
      # timeout 入力は10分（600000ms）が上限でクランプされるため、延ばして回避はできない。
      # 詰まったときは詰まったデプロイをキャンセルし、新しいコミットで押し直す：
      #   gh api -X POST "repos/:owner/:repo/pages/deployments/<SHA>/cancel"
      #   git commit --allow-empty -m "Pages の再デプロイ" && git push
      # 同一SHAでの rerun は効かない（デプロイIDがSHAと同じで、キャンセル済み記録に当たる）。
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
